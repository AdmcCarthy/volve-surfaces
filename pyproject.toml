[project]
name = "volve-surfaces"
version = "0.1.0"
description = "Volve geophysical interpretations as smoothed, shaded contour maps in the browser (D3)"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.14", "pyproj>=3.6", "pandas>=2.2", "contourpy>=1.3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
